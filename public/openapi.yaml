openapi: 3.1.0
info:
  title: FCToernooi API
  description: |
    REST API for the FCToernooi tournament management application.
    Built with Slim Framework 4.

    **Authentication:** Most endpoints require a JWT Bearer token obtained via
    `/public/auth/login` or `/public/auth/register`. Pass it as
    `Authorization: Bearer <token>`.

    Routes under `/public` are accessible without authentication.
  version: 1.0.0
  contact:
    name: FCToernooi
    email: info@fctoernooi.nl

servers:
  - url: /
    description: Current server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from /public/auth/login or /public/auth/register

  schemas:
    AuthItem:
      type: object
      properties:
        token:
          type: string
          description: JWT access token
        userId:
          type: integer
          description: ID of the authenticated user
      required: [token, userId]

    AuthRegisterRequest:
      type: object
      properties:
        emailaddress:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 1
      required: [emailaddress, password]

    AuthLoginRequest:
      type: object
      properties:
        emailaddress:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 1
      required: [emailaddress, password]

    AuthPasswordResetRequest:
      type: object
      properties:
        emailaddress:
          type: string
          format: email
      required: [emailaddress]

    AuthPasswordChangeRequest:
      type: object
      properties:
        emailaddress:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 1
        code:
          type: string
      required: [emailaddress, password, code]

    AuthProfileRequest:
      type: object
      properties:
        emailaddress:
          type: string
          format: email
        password:
          type: string
          format: password

    User:
      type: object
      properties:
        id:
          type: integer
        emailaddress:
          type: string
          format: email
        validated:
          type: boolean
        nrOfCredits:
          type: integer

    Tournament:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        public:
          type: boolean
        startEditMode:
          type: string
        createAndJoinPlace:
          type: boolean

    TournamentShell:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        public:
          type: boolean
        startDateTime:
          type: string
          format: date-time

    Structure:
      type: object
      description: Tournament structure (rounds, poules, places)
      additionalProperties: true

    PlanningTotals:
      type: object
      description: Planning totals per round number
      additionalProperties: true

    Referee:
      type: object
      properties:
        id:
          type: integer
        initials:
          type: string
        name:
          type: string
        emailaddress:
          type: string
          format: email
        priority:
          type: integer

    CompetitionSport:
      type: object
      properties:
        id:
          type: integer
        sport:
          $ref: '#/components/schemas/Sport'

    Sport:
      type: object
      properties:
        id:
          type: integer
        customId:
          type: integer
        name:
          type: string

    Field:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        priority:
          type: integer

    GameAgainst:
      type: object
      description: Against-type game
      additionalProperties: true

    GameTogether:
      type: object
      description: Together-type game
      additionalProperties: true

    Competitor:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        registered:
          type: boolean

    PlanningConfig:
      type: object
      description: Planning configuration for a round number
      additionalProperties: true

    GameAmountConfig:
      type: object
      description: Game amount configuration for a round number and competition sport
      additionalProperties: true

    ScoreConfig:
      type: object
      description: Score configuration for a round and competition sport
      additionalProperties: true

    AgainstQualifyConfig:
      type: object
      description: Against qualify configuration for a round and competition sport
      additionalProperties: true

    Planning:
      type: object
      description: Planning for a round number
      additionalProperties: true

    PlanningProgress:
      type: object
      properties:
        state:
          type: string
        nrOfBatchGames:
          type: integer

    Rule:
      type: object
      properties:
        id:
          type: integer
        text:
          type: string
        priority:
          type: integer

    Sponsor:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        url:
          type: string
          format: uri
        logoExtension:
          type: string
        screenNr:
          type: integer

    LockerRoom:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string

    Recess:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        startDateTime:
          type: string
          format: date-time
        endDateTime:
          type: string
          format: date-time

    TournamentUser:
      type: object
      properties:
        id:
          type: integer
        roles:
          type: array
          items:
            type: integer

    Invitation:
      type: object
      properties:
        id:
          type: integer
        emailaddress:
          type: string
          format: email
        roles:
          type: array
          items:
            type: integer

    Registration:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        emailaddress:
          type: string
          format: email
        telephone:
          type: string
        info:
          type: string

    RegistrationSettings:
      type: object
      description: Registration settings for a tournament
      additionalProperties: true

    PaymentMethod:
      type: object
      properties:
        id:
          type: string
        description:
          type: string

    IDealIssuer:
      type: object
      properties:
        id:
          type: string
        name:
          type: string

    Payment:
      type: object
      properties:
        id:
          type: string
        amount:
          type: number
        status:
          type: string
        checkoutUrl:
          type: string
          format: uri

    BuyCreditsRequest:
      type: object
      properties:
        method:
          type: string
        issuer:
          type: string
        amount:
          type: number
      required: [method, amount]

    RoleState:
      type: object
      properties:
        userId:
          type: integer

    PdfProgress:
      type: object
      properties:
        state:
          type: string
        percentage:
          type: integer

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

  responses:
    Unauthorized:
      description: Authentication required or token invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: Validation or business logic error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

tags:
  - name: Auth
    description: Authentication and account management
  - name: User
    description: User profile management
  - name: Shell
    description: Tournament shell (public listing)
  - name: Sport
    description: Sports catalogue
  - name: Payment
    description: Payments and credits (Mollie)
  - name: Tournament
    description: Tournament CRUD
  - name: Structure
    description: Tournament structure
  - name: Referee
    description: Tournament referees
  - name: CompetitionSport
    description: Competition sports per tournament
  - name: Field
    description: Fields per competition sport
  - name: Game
    description: Games (against / together)
  - name: Competitor
    description: Tournament competitors
  - name: Planning
    description: Tournament planning
  - name: Rule
    description: Tournament rules
  - name: Sponsor
    description: Tournament sponsors
  - name: LockerRoom
    description: Locker rooms
  - name: Recess
    description: Tournament recesses
  - name: TournamentUser
    description: Tournament user roles
  - name: Invitation
    description: Tournament invitations
  - name: Registration
    description: Tournament registrations
  - name: RegistrationSettings
    description: Registration settings and subjects
  - name: Pdf
    description: PDF generation

paths:

  # ─────────────────────────────────────────────
  # PUBLIC AUTH
  # ─────────────────────────────────────────────

  /public/auth/register:
    post:
      tags: [Auth]
      summary: Register a new user account
      operationId: authRegister
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRegisterRequest'
      responses:
        '200':
          description: Registration successful – returns JWT token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthItem'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /public/auth/login:
    post:
      tags: [Auth]
      summary: Log in with email and password
      operationId: authLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
      responses:
        '200':
          description: Login successful – returns JWT token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthItem'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /public/auth/passwordreset:
    post:
      tags: [Auth]
      summary: Request a password reset code by email
      operationId: authPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthPasswordResetRequest'
      responses:
        '200':
          description: Reset email sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  retval:
                    type: boolean
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /public/auth/passwordchange:
    post:
      tags: [Auth]
      summary: Change password using a reset code
      operationId: authPasswordChange
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthPasswordChangeRequest'
      responses:
        '200':
          description: Password changed – returns new JWT token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthItem'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  # ─────────────────────────────────────────────
  # AUTH (JWT required)
  # ─────────────────────────────────────────────

  /auth/extendtoken:
    post:
      tags: [Auth]
      summary: Extend (refresh) the current JWT token
      operationId: authExtendToken
      security:
        - bearerAuth: []
      responses:
        '200':
          description: New JWT token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /auth/profile/{userId}:
    put:
      tags: [Auth]
      summary: Update the authenticated user's profile
      operationId: authProfile
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthProfileRequest'
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /auth/validate/{code}:
    post:
      tags: [Auth]
      summary: Validate account with a 6-digit code
      operationId: authValidate
      security:
        - bearerAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Account validated – returns updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /auth/validationrequest:
    post:
      tags: [Auth]
      summary: Request a new validation code to be sent by email
      operationId: authValidationRequest
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Validation email sent
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  # ─────────────────────────────────────────────
  # USERS
  # ─────────────────────────────────────────────

  /users/{userId}:
    get:
      tags: [User]
      summary: Fetch the authenticated user's profile
      operationId: userFetchOne
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [User]
      summary: Edit the authenticated user's profile
      operationId: userEdit
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '200':
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags: [User]
      summary: Delete the authenticated user account
      operationId: userRemove
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: User deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  # ─────────────────────────────────────────────
  # SHELLS (PUBLIC)
  # ─────────────────────────────────────────────

  /public/shells:
    get:
      tags: [Shell]
      summary: Fetch public tournament shells (no auth required)
      operationId: shellFetchPublic
      parameters:
        - name: startDate
          in: query
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: List of tournament shells
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TournamentShell'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /shellswithrole:
    get:
      tags: [Shell]
      summary: Fetch tournament shells visible to the authenticated user (with role info)
      operationId: shellFetchWithRole
      security:
        - bearerAuth: []
      parameters:
        - name: startDate
          in: query
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: List of tournament shells with role information
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TournamentShell'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /shells:
    get:
      tags: [Shell]
      summary: Fetch tournament shells (authenticated)
      operationId: shellFetchAuthenticated
      security:
        - bearerAuth: []
      parameters:
        - name: startDate
          in: query
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: List of tournament shells
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TournamentShell'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  # ─────────────────────────────────────────────
  # SPORTS
  # ─────────────────────────────────────────────

  /sports:
    get:
      tags: [Sport]
      summary: Fetch all sports
      operationId: sportFetch
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of sports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Sport'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Sport]
      summary: Add a new sport
      operationId: sportAdd
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Sport'
      responses:
        '200':
          description: Created sport
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /sports/{sportCustomId}:
    get:
      tags: [Sport]
      summary: Fetch a single sport by custom ID
      operationId: sportFetchOne
      security:
        - bearerAuth: []
      parameters:
        - name: sportCustomId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Sport
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ─────────────────────────────────────────────
  # PAYMENTS
  # ─────────────────────────────────────────────

  /payments/methods:
    get:
      tags: [Payment]
      summary: Fetch available payment methods
      operationId: paymentFetchMethods
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of payment methods
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentMethod'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /payments/idealissuers:
    get:
      tags: [Payment]
      summary: Fetch iDeal issuers (banks)
      operationId: paymentFetchIDealIssuers
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of iDeal issuers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IDealIssuer'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /payments/buycredits:
    post:
      tags: [Payment]
      summary: Buy credits via Mollie payment
      operationId: paymentBuyCredits
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuyCreditsRequest'
      responses:
        '200':
          description: Payment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /payments/mostrecentcreatedpayment:
    get:
      tags: [Payment]
      summary: Fetch the most recently created payment for the current user
      operationId: paymentFetchMostRecentCreated
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Most recent payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /payments/{paymentId}:
    get:
      tags: [Payment]
      summary: Fetch a single payment by ID
      operationId: paymentFetchOne
      security:
        - bearerAuth: []
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /public/paymentUpdate:
    get:
      tags: [Payment]
      summary: Mollie payment webhook (GET)
      operationId: paymentWebhookGet
      responses:
        '200':
          description: Webhook processed
    post:
      tags: [Payment]
      summary: Mollie payment webhook (POST)
      operationId: paymentWebhookPost
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                id:
                  type: string
      responses:
        '200':
          description: Webhook processed

  /public/paymentRedirect/{paymentId}:
    get:
      tags: [Payment]
      summary: Redirect after Mollie payment completion
      operationId: paymentRedirect
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '302':
          description: Redirect to frontend payment result page

  # ─────────────────────────────────────────────
  # USAGE REPORT
  # ─────────────────────────────────────────────

  /public/usagereport:
    get:
      tags: [Tournament]
      summary: Public usage report (HTML)
      operationId: reportUsage
      responses:
        '200':
          description: HTML usage report
          content:
            text/html:
              schema:
                type: string

  # ─────────────────────────────────────────────
  # PUBLIC TOURNAMENT
  # ─────────────────────────────────────────────

  /public/tournaments/{tournamentId}:
    get:
      tags: [Tournament]
      summary: Fetch a public tournament by ID
      operationId: publicTournamentFetchOne
      parameters:
        - name: tournamentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Tournament
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tournament'
        '404':
          $ref: '#/components/responses/NotFound'

  /public/tournaments/{tournamentId}/structure:
    get:
      tags: [Structure]
      summary: Fetch the structure of a public tournament
      operationId: publicStructureFetchOne
      parameters:
        - name: tournamentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Tournament structure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Structure'
        '404':
          $ref: '#/components/responses/NotFound'

  /public/tournaments/{tournamentId}/rules:
    get:
      tags: [Rule]
      summary: Fetch rules of a public tournament
      operationId: publicRuleFetch
      parameters:
        - name: tournamentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Rule'

  /public/tournaments/{tournamentId}/registrations/settings:
    get:
      tags: [RegistrationSettings]
      summary: Fetch registration settings for a public tournament
      operationId: publicRegistrationSettingsFetchOne
      parameters:
        - name: tournamentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Registration settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationSettings'

  /public/tournaments/{tournamentId}/categories/{categoryId}/registrations:
    post:
      tags: [Registration]
      summary: Submit a registration for a public tournament category
      operationId: publicRegistrationAdd
      parameters:
        - name: tournamentId
          in: path
          required: true
          schema:
            type: integer
        - name: categoryId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
