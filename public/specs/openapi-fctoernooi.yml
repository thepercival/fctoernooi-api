components:
  schemas:
    RegisterAndLoginInfo:
      type: object
      properties:
        emailaddress:
          type: string
        password:
          type: string
  securitySchemes:
    bearerAuth: # arbitrary name for the security scheme
      type: http
      scheme: bearer
      bearerFormat: JWT # optional, arbitrary value for documentation purposes  