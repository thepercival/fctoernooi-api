openapi: '3.0.3'
info:
  title: FCToernooi Auth
  version: '1.0'
servers:
  - url: http://localhost:3001/
paths:
  /tournaments/:
    get:
      summary: Get the tournament
      security:
        - bearerAuth: []      
      description: Get the user by id
      parameters:
      - in: path
        name: tournamentId
        schema:
          oneOf:
          - type: string
          - type: integer
        required: true
        description: Numeric ID of the tournament to get
      responses:
        '200':
          description: Created
        '400':
          description: Bad Request
